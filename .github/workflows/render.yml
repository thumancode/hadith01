name: Render Hadith Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme: A (9:16 vertical), B (16:9 horizontal), both"
        required: true
        default: A
        type: choice
        options: [A, B, both]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-cache -f
          fc-list | grep -i "bengali" | head -3

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render theme A
        if: ${{ inputs.theme == 'A' || inputs.theme == 'both' }}
        run: node render.js --theme A

      - name: Render theme B
        if: ${{ inputs.theme == 'B' || inputs.theme == 'both' }}
        run: node render.js --theme B

      - uses: actions/upload-artifact@v4
        with:
          name: hadith-video
          path: output/*.mp4
